<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech vs Nature - Coexistence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Technology Theme -->
        <div class="split tech-side">
            <div class="content">
                <h2>Technology</h2>
                <button class="tech-button">Explore Tech</button>
            </div>
        </div>
        
        <!-- Nature Theme -->
        <div class="split nature-side">
            <div class="content">
                <h2>Nature</h2>
                <button class="nature-button">Explore Nature</button>
            </div>
        </div>
    </div>
</body>
</html>
